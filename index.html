<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אנשי קשר</title>
    <!-- <script type="module" src="script.js"></script> -->
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="direction: rtl;">
    <h1>אנשי קשר</h1>
    <form>
        <input type="text" id="name" name="name" placeholder="שם">
        <input type="tel" name="phone" id="phone" placeholder="טלפון">
        <select name="category" id="category">
            <option value="🏠👨‍👩‍👧">משפחה</option>
            <option value="❤️🧑‍🤝‍🧑">חברים</option>
            <option value="💼🏢">עבודה</option>
</select>
        <button type="submit">הוסף</button>
    </form>
    <div id="contacts"></div>
    <div class="actions">
        <button onclick="print()">הדפסה</button>
        <button id="delete">מחיקת אנשי הקשר</button>
        <button onclick="window.close()">סגירת האתר</button>
    </div>
</body>
</html>
